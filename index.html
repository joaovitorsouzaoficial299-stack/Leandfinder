<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LeadFinder</title>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#13151a;--panel:#1a1d24;--panel2:#20242c;--line:#2b303a;--tx:#e9e7e2;--mut:#9097a3;--ac:#8b9bff;--hot:#ff6b57;--ok:#4ac78b;--warn:#f0b84a;--blue:#5aa8ff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root:not([data-theme="dark"]){color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:radial-gradient(600px 400px at 85% -5%,rgba(139,155,255,.22),transparent 70%),radial-gradient(500px 400px at 10% 105%,rgba(255,107,87,.14),transparent 70%),var(--bg);background-attachment:fixed;color:var(--tx);font:15px/1.5 'Schibsted Grotesk',system-ui,-apple-system,Segoe UI,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:flex;min-height:100vh}
aside{width:236px;background:var(--panel);border-right:1px solid var(--line);padding:20px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px;flex-shrink:0}
.logo{font-weight:700;font-size:20px;letter-spacing:-.02em;padding:4px 10px 18px;display:flex;align-items:center;gap:8px}
.logo i{width:22px;height:22px;border-radius:7px;background:conic-gradient(from 200deg,var(--ac),var(--hot),var(--ac));display:inline-block}
.nav{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;color:var(--mut);cursor:pointer;border:0;background:none;text-align:left;width:100%;transition:background .15s,color .15s}
.nav{border:1px solid transparent;border-radius:12px}.nav:hover{background:rgba(255,255,255,.07);color:var(--tx);border-color:rgba(255,255,255,.12)}.nav.on{color:var(--tx);border-color:rgba(255,255,255,.2);background:linear-gradient(160deg,rgba(139,155,255,.28),rgba(255,255,255,.04));-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 4px 14px rgba(0,0,0,.25)}
.nav b{margin-left:auto;font-weight:500;font-size:12px;background:rgba(255,255,255,.12);border-radius:20px;padding:0 8px}
.demo{margin-top:auto;font-size:12px;color:var(--mut);border:1px dashed var(--line);border-radius:10px;padding:10px}
main{flex:1;min-width:0;padding:28px clamp(16px,3vw,40px) 60px;max-width:1280px}
.top{display:none}
h1{font-size:26px;letter-spacing:-.02em;margin:0 0 4px}h2{font-size:16px;margin:0 0 12px}
.sub{color:var(--mut);margin:0 0 22px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:18px}
.grid{display:grid;gap:14px}.stats{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.stat{padding:16px}.stat small{color:var(--mut)}.stat div{font-size:30px;font-weight:700;letter-spacing:-.03em}
.two{grid-template-columns:1.2fr 1fr;margin-top:14px}
.bars{display:flex;align-items:flex-end;gap:10px;height:150px}.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;height:100%;font-size:12px;color:var(--mut)}
.bars span{width:100%;background:linear-gradient(var(--ac),#5a68d8);border-radius:6px 6px 0 0;min-height:4px;transition:height .5s}
.funnel .row{display:grid;grid-template-columns:110px 1fr 40px;align-items:center;gap:10px;margin:9px 0;font-size:14px}
.funnel .t{height:8px;background:var(--panel2);border-radius:8px;overflow:hidden}.funnel .t i{display:block;height:100%;background:var(--ac)}
.row2{display:grid;grid-template-columns:2fr 1.4fr 1fr auto;gap:10px;align-items:end}
label{display:block;font-size:12px;color:var(--mut);margin-bottom:4px}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 12px;min-height:44px}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--ac);outline-offset:1px}
.btn{--g:255,255,255;border:1px solid rgba(255,255,255,.2);background:linear-gradient(160deg,rgba(var(--g),.16),rgba(var(--g),.04));-webkit-backdrop-filter:blur(14px) saturate(170%);backdrop-filter:blur(14px) saturate(170%);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 -1px 0 rgba(255,255,255,.06),0 4px 14px rgba(0,0,0,.28);color:var(--tx);border-radius:12px;padding:10px 14px;cursor:pointer;min-height:44px;transition:transform .12s,background .15s,border-color .15s;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:hover{border-color:rgba(255,255,255,.4);background:linear-gradient(160deg,rgba(var(--g),.26),rgba(var(--g),.08));transform:translateY(-1px)}.btn:active{transform:translateY(0)}
.btn.p{--g:139,155,255;color:#fff;font-weight:600;border-color:rgba(139,155,255,.55);background:linear-gradient(160deg,rgba(139,155,255,.5),rgba(139,155,255,.14))}.btn.p:hover{background:linear-gradient(160deg,rgba(139,155,255,.65),rgba(139,155,255,.22));border-color:rgba(139,155,255,.8)}.btn.wa{--g:74,199,139;color:#fff;border-color:rgba(74,199,139,.5);background:linear-gradient(160deg,rgba(74,199,139,.42),rgba(74,199,139,.1))}.btn.sm{min-height:36px;padding:6px 10px;font-size:13px}
.filters{margin-top:14px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.filters .act{grid-column:1/-1;display:flex;gap:10px;flex-wrap:wrap}
details.card summary{cursor:pointer;font-weight:600;min-height:28px}
.results{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px;margin-top:18px}
.lead{display:flex;flex-direction:column;gap:8px;transition:border-color .15s,transform .15s}.lead:hover{border-color:var(--ac);transform:translateY(-2px)}
.lead h3{margin:0;font-size:17px;letter-spacing:-.01em}.meta{color:var(--mut);font-size:13px}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12px;padding:2px 9px;border-radius:20px;border:1px solid var(--line);color:var(--mut)}
.nosite{background:rgba(255,107,87,.14);color:var(--hot);border-color:rgba(255,107,87,.4);font-weight:600}
.hi{color:var(--hot);border-color:rgba(255,107,87,.4)}.mid{color:var(--warn);border-color:rgba(240,184,74,.4)}.lo{color:var(--mut)}
.score{display:flex;align-items:center;gap:8px;font-size:13px}.score .t{flex:1;height:6px;background:var(--panel2);border-radius:6px;overflow:hidden}.score i{display:block;height:100%}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
.st{border-radius:20px;padding:2px 10px;font-size:12px;border:1px solid var(--line)}
table{width:100%;border-collapse:collapse}th{text-align:left;color:var(--mut);font-weight:500;font-size:13px;padding:10px;border-bottom:1px solid var(--line)}td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tw{overflow-x:auto}
.empty{text-align:center;color:var(--mut);padding:40px 10px;border:1px dashed var(--line);border-radius:14px;margin-top:18px}
.modal{position:fixed;inset:0;background:rgba(5,6,9,.72);display:none;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal.on{display:flex}.sheet{background:var(--panel);border:1px solid var(--line);border-radius:16px;width:min(680px,100%);max-height:92vh;overflow:auto;padding:22px;animation:pop .18s ease-out}
@keyframes pop{from{transform:translateY(12px);opacity:0}}
.kv{display:grid;grid-template-columns:130px 1fr;gap:6px 12px;margin:14px 0;font-size:14px}.kv span{color:var(--mut)}
.an{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:grid;gap:4px;font-size:14px;margin:12px 0}
pre{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;overflow:auto;max-height:240px;font-size:12px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(30px);background:var(--ac);color:#10131c;padding:10px 16px;border-radius:10px;opacity:0;transition:.25s;z-index:99;font-weight:600;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}

/* Cinematic radar feature */
.radar-feature{position:relative;isolation:isolate;overflow:hidden;border:1px solid #263f48;border-radius:18px;margin:0 0 22px;background:#06131c;min-height:260px;box-shadow:0 18px 55px #0007}
.radar-scene{position:absolute;inset:0;background:linear-gradient(90deg,rgba(2,10,16,.96) 0%,rgba(2,10,16,.83) 42%,rgba(3,18,29,.22) 100%),radial-gradient(ellipse at 80% 15%,#b0a0b9 0%,#203b59 20%,#071d31 48%,#02080e 80%);overflow:hidden}
.radar-sea{position:absolute;inset:0 0 0 42%;opacity:.75;background:repeating-linear-gradient(177deg,transparent 0 17px,#8cb3ca12 18px 19px),linear-gradient(180deg,#263d58,#0a2335 55%,#020b13)}
.radar-sea:after{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 80% 25%,#ffc780b0 0 1px,transparent 3px),radial-gradient(ellipse at 62% 36%,#ffc780aa 0 1px,transparent 3px),radial-gradient(ellipse at 94% 17%,#ffc780bb 0 2px,transparent 4px);animation:shipTwinkle 3s ease-in-out infinite alternate}
.radar-console{position:relative;z-index:1;width:min(64%,560px);margin:22px 0 22px 22px;padding:12px;border:2px solid #25313a;border-radius:13px;background:linear-gradient(145deg,#121a22,#020609);box-shadow:0 14px 36px #000b,inset 0 1px 0 #ffffff16;transform-origin:center;animation:radarPush 8s ease-in-out infinite alternate}
.radar-brand{font-size:10px;font-weight:700;letter-spacing:.22em;color:#7b8996;padding:0 5px 8px}
.radar-screen{position:relative;aspect-ratio:1.22;background:#00100c;border:1px solid #1e4837;overflow:hidden;box-shadow:inset 0 0 36px #00ff6330}
.radar-scope{position:absolute;width:68%;aspect-ratio:1;left:8%;top:10%;border:1px solid #1bdc7c9c;border-radius:50%;background:repeating-radial-gradient(circle,transparent 0 12%,#27ff8a2b 12.2% 12.6%,transparent 12.8% 25%);box-shadow:0 0 20px #00ff4912}
.radar-scope:before{content:"";position:absolute;left:50%;top:50%;height:50%;width:1px;background:#35ff9c;transform:translateX(-50%)}
.radar-sweep{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 35deg,transparent 0deg,transparent 305deg,#00ff5730 328deg,#35ff87b0 354deg,#00ff5712 360deg);animation:radarRotate 4s linear infinite;filter:drop-shadow(0 0 4px #00ff69)}
.radar-sweep:after{content:"";position:absolute;left:50%;top:50%;height:50%;width:2px;transform:translateX(-50%);transform-origin:top;background:linear-gradient(#75ffad,#20ff6b55);box-shadow:0 0 7px #00ff7b}
.radar-heading{position:absolute;left:50%;top:0;height:50%;width:1px;background:#b2ffc6;opacity:.85;transform:rotate(315deg);transform-origin:bottom}
.radar-dot{position:absolute;width:5px;height:5px;background:#bcffba;border-radius:50%;box-shadow:0 0 7px 2px #1aff69;animation:blip 4s ease-in-out infinite}
.radar-dot.d1{left:24%;top:31%}.radar-dot.d2{left:67%;top:39%;animation-delay:1.1s}.radar-dot.d3{left:61%;top:75%;animation-delay:2.2s}
.radar-label{position:absolute;font-size:clamp(6px,.8vw,10px);color:#a5ffc7;text-shadow:0 0 5px #00ff6a;white-space:nowrap}
.radar-label.l1{left:27%;top:29%}.radar-label.l2{left:70%;top:37%}.radar-label.l3{left:63%;top:74%}
.radar-readout{position:absolute;right:3%;top:8%;color:#65ffad;font:clamp(7px,.9vw,11px)/1.9 monospace;border:1px solid #1e6747;padding:5px}
.radar-hand{position:absolute;z-index:3;right:5%;bottom:3%;width:20%;height:34%;min-width:54px;filter:drop-shadow(0 7px 9px #000c);transform:rotate(-2deg);transform-origin:70% 80%;animation:handAdjust 8s ease-in-out infinite alternate}
.radar-knob{position:absolute;z-index:2;right:16%;bottom:22%;width:54px;height:54px;border-radius:50%;border:3px solid #303c42;background:repeating-conic-gradient(#161e22 0deg 5deg,#3d494e 6deg 8deg);box-shadow:inset 0 0 0 8px #11181c,0 0 15px #00ff6933}
.radar-knob:after{content:"";position:absolute;left:50%;top:6px;height:14px;width:2px;background:#55ff9e;transform:translateX(-50%)}
.radar-caption{position:relative;z-index:4;padding:18px 20px 20px;max-width:390px;text-shadow:0 2px 12px #000}
.radar-eyebrow{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#62fca3;font-weight:700}
.radar-caption h2{font-size:clamp(20px,3vw,30px);line-height:1.08;margin:8px 0;color:#f0f8f5;letter-spacing:-.04em}
.radar-caption p{font-size:12px;color:#b1c6cb;margin:0;max-width:280px}
@keyframes radarRotate{to{transform:rotate(360deg)}}@keyframes blip{0%,15%,100%{opacity:.45}25%,42%{opacity:1;box-shadow:0 0 12px 4px #00ff6a}}@keyframes shipTwinkle{to{opacity:.45}}@keyframes radarPush{from{transform:scale(1)}to{transform:scale(1.035)}}@keyframes handAdjust{from{transform:rotate(-2deg)}to{transform:rotate(1.5deg)}}
@media(max-width:620px){.radar-feature{min-height:390px}.radar-scene{background:linear-gradient(180deg,rgba(2,10,16,.9),rgba(2,10,16,.2) 70%),radial-gradient(ellipse at 70% 20%,#52647d,#071d31 70%)}.radar-console{width:calc(100% - 28px);margin:118px 14px 14px}.radar-caption{position:absolute;top:10px;left:0;padding:14px}.radar-caption h2{font-size:21px}.radar-caption p{max-width:90%}.radar-hand{right:2%;bottom:1%;width:15%;height:25%}}
@media(prefers-reduced-motion:reduce){.radar-sweep,.radar-dot,.radar-sea:after,.radar-console,.radar-hand{animation:none!important}}

.badge{font-size:11px;background:var(--warn);color:#2a1d00;border-radius:6px;padding:1px 6px;font-weight:700}
.ents{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}.ents div{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-size:13px}
@media(max-width:900px){
 aside{position:fixed;left:0;top:0;z-index:40;transform:translateX(-100%);transition:transform .22s;padding-top:calc(20px + env(safe-area-inset-top,0px))}
 aside.open{transform:none}.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:39;display:none}.scrim.on{display:block}
 .top{display:flex;align-items:center;gap:12px;margin-bottom:18px}
 .two,.row2{grid-template-columns:1fr}.results{grid-template-columns:1fr}
 table.rt thead{display:none}table.rt,table.rt tbody,table.rt tr,table.rt td{display:block;width:100%}
 table.rt tr{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;padding:6px}
 table.rt td{border:0;display:flex;justify-content:space-between;gap:12px;align-items:center}table.rt td:before{content:attr(data-l);color:var(--mut);font-size:12px}
 .kv{grid-template-columns:100px 1fr}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="scrim" id="scrim"></div>
<div class="app">
<aside id="side">
 <div class="logo"><i></i>LeadFinder</div>
 <button class="nav on" data-v="dash">Painel</button>
 <button class="nav" data-v="search">Buscar leads</button>
 <button class="nav" data-v="saved">Leads salvos <b id="nSaved">0</b></button>
 <button class="nav" data-v="mine">Meus leads</button>
 <button class="nav" data-v="cfg">Configurações</button>
 <div class="demo">Busca real via OpenStreetMap</div>
</aside>
<main>
 <div class="top"><button class="btn" id="burger" aria-label="Abrir menu">Menu</button><b style="font-size:18px">LeadFinder</b></div>
 <div id="view"></div>
</main>
</div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ============ tipos (referência) ============
 Lead { id, name, category, address, city, state, rating, reviews, website, instagram, phone, whatsapp, hours, openNow, lat, lng }
 SavedLead { lead, status, notes, savedAt }  → tabelas futuras: users, leads, saved_leads, lead_notes, lead_status, searches */

/* ============ config ============ */
const STATUSES=['Novo','Contatado','Respondeu','Em negociação','Cliente','Sem interesse'];
const STCOLOR={'Novo':'var(--ok)','Contatado':'var(--warn)','Respondeu':'var(--blue)','Em negociação':'var(--ac)','Cliente':'var(--ok)','Sem interesse':'var(--hot)'};
const CATS=[
 {id:'loja',i:'🏪',l:'Lojas sem site',n:'Loja',nosite:1},{id:'rest',i:'🍔',l:'Restaurantes sem site',n:'Restaurante',nosite:1},
 {id:'barb',i:'💈',l:'Barbearias sem site',n:'Barbearia',nosite:1},{id:'salao',i:'💅',l:'Salões de beleza sem site',n:'Salão',nosite:1},
 {id:'odon',i:'🦷',l:'Clínicas odontológicas sem site',n:'Clínica Odontológica',nosite:1},{id:'acad',i:'🏋️',l:'Academias sem site',n:'Academia',nosite:1},
 {id:'assist',i:'🔧',l:'Assistências técnicas sem site',n:'Assistência Técnica',nosite:1},{id:'imob',i:'🏠',l:'Imobiliárias sem site',n:'Imobiliária',nosite:1},
 {id:'ofic',i:'🚗',l:'Oficinas mecânicas sem site',n:'Oficina Mecânica',nosite:1},{id:'pet',i:'🐾',l:'Pet shops sem site',n:'Pet Shop',nosite:1},
 {id:'roupa',i:'👗',l:'Lojas de roupas sem site',n:'Loja de Roupas',nosite:1},{id:'cel',i:'📱',l:'Lojas de celulares',n:'Loja de Celulares'},
 {id:'local',i:'💼',l:'Empresas locais',n:'Empresa Local'},{id:'perto',i:'📍',l:'Negócios próximos',n:'Negócio Local'},{id:'custom',i:'🔎',l:'Busca personalizada',n:'Negócio'}];
const HOT_CATS=['barb','salao','odon','rest','assist','pet','acad','imob'];
const DEMO_STATS={found:1248,nosite:438,saved:86,contacted:42,neg:8,won:3,weekly:[[ 'Sem 1',120],['Sem 2',210],['Sem 3',180],['Sem 4',290],['Sem 5',260],['Sem 6',340]]};

/* ============ services/leads — ÚNICO ponto de troca para API real ============
 Para conectar Google Places / OpenStreetMap / Supabase: substitua a função
 LeadsService.search por uma chamada ao seu backend (ex.: /api/leads/search)
 que retorne Lead[]. A interface não precisa mudar. */
let SRC='demo',ERR='';
/* Busca real, direto do navegador (sem backend): OpenStreetMap por padrão; Google Places se houver chave em Configurações. */
const OSM={loja:'["shop"]',rest:'["amenity"~"^(restaurant|fast_food|bar|cafe)$"]',barb:'["shop"~"^(hairdresser|barber)$"]',salao:'["shop"~"^(hairdresser|beauty)$"]',odon:'["amenity"="dentist"]',acad:'["leisure"="fitness_centre"]',assist:'["shop"~"^(mobile_phone|computer|electronics)$"]',imob:'["office"="estate_agent"]',ofic:'["shop"="car_repair"]',pet:'["shop"="pet"]',roupa:'["shop"="clothes"]',cel:'["shop"="mobile_phone"]',local:'["shop"]',perto:'["shop"]'};
const GQ={loja:'lojas',rest:'restaurantes',barb:'barbearias',salao:'salões de beleza',odon:'clínicas odontológicas',acad:'academias',assist:'assistências técnicas',imob:'imobiliárias',ofic:'oficinas mecânicas',pet:'pet shops',roupa:'lojas de roupas',cel:'lojas de celulares',local:'empresas',perto:'comércios'};
const SOCIAL=/(instagram\.com|facebook\.com|fb\.com|linktr\.ee|wa\.me|whatsapp\.com)/i;
const gkey=()=>{try{return localStorage.getItem('lf_gkey')||''}catch(e){return ''}};
function waFrom(ph){const d=String(ph||'').replace(/\D/g,'').replace(/^55/,'');return d.length===11&&d[2]==='9'?'55'+d:''}
function splitC(url,ig,ph,wa){let site=url||'',ins=ig||'';if(site&&SOCIAL.test(site)){if(/instagram/i.test(site)&&!ins)ins=site;site=''}
 if(ins.startsWith('http'))ins='@'+ins.replace(/\/$/,'').split('/').pop();return{website:site,instagram:ins,whatsapp:String(wa||'').replace(/\D/g,'')||waFrom(ph)}}
async function geocode(q){const r=await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=br&q='+encodeURIComponent(q));
 const j=await r.json();if(!j[0])throw new Error('Localização não encontrada');return{lat:+j[0].lat,lng:+j[0].lon}}
async function googleSearch(p,c,key){const label=p.category==='custom'?(p.custom||'empresas'):GQ[p.category]||'empresas';
 const r=await fetch('https://places.googleapis.com/v1/places:searchText',{method:'POST',headers:{'Content-Type':'application/json','X-Goog-Api-Key':key,
  'X-Goog-FieldMask':'places.id,places.displayName,places.formattedAddress,places.rating,places.userRatingCount,places.websiteUri,places.nationalPhoneNumber,places.location,places.currentOpeningHours.openNow,places.primaryTypeDisplayName'},
  body:JSON.stringify({textQuery:label+' em '+p.location,languageCode:'pt-BR',pageSize:20,locationBias:{circle:{center:{latitude:c.lat,longitude:c.lng},radius:Math.min(50000,p.radius*1000)}}})});
 const j=await r.json();if(!r.ok)throw new Error((j.error&&j.error.message)||'Erro no Google Places');
 return(j.places||[]).map(x=>({id:'gp-'+x.id,name:(x.displayName||{}).text||'Sem nome',category:(x.primaryTypeDisplayName||{}).text||label,address:x.formattedAddress||'',
  rating:x.rating??null,reviews:x.userRatingCount??null,phone:x.nationalPhoneNumber||'',hours:'',openNow:x.currentOpeningHours?x.currentOpeningHours.openNow:null,

 if(a==='close')$('#modal').classList.remove('on');
 else if(a==='search')doSearch();
 else if(a==='apply'){readF();render();toast('Filtros aplicados')}
 else if(a==='clear'){F={site:'',ig:false,wa:false,minR:0,minRev:0,open:false,contacted:''};render()}
 else if(a==='det')detail(id);
 else if(a==='save'){if(saved[id]){delete saved[id];toast('Removido dos favoritos')}else{saveLead(id);toast('Lead salvo')}persist();render()}
 else if(a==='savenote'){saveLead(id,$('#dn').value);$('#modal').classList.remove('on');render();toast('Lead salvo')}
 else if(a==='rm'){delete saved[id];persist();render();toast('Lead removido')}
 else if(a==='export')exportModal();
 else if(a==='dlcsv'){dl('leads.csv',csv(),'text/csv;charset=utf-8');toast('CSV gerado')}
 else if(a==='dlxls'){dl('leads.xls',xls(),'application/vnd.ms-excel');toast('Excel gerado')}
 else if(a==='cpcsv'){try{navigator.clipboard.writeText(csv()).then(()=>toast('CSV copiado'))}catch(x){toast('Selecione e copie o texto')}}
 else if(a==='savekey'){try{localStorage.setItem('lf_gkey',$('#g-key').value.trim())}catch(x){}toast('Chave salva')}
 else if(a==='wipe'){saved={};persist();render();toast('Dados apagados')}
});
document.addEventListener('change',e=>{
 if(e.target.id==='q-cat'){$('#cw').style.display=e.target.value==='custom'?'':'none'}
 if(e.target.dataset.st){saved[e.target.dataset.st].status=e.target.value;persist();$('#nSaved').textContent=Object.keys(saved).length;toast('Status atualizado')}
 if(e.target.dataset.nt){saved[e.target.dataset.nt].notes=e.target.value;persist()}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#modal').classList.remove('on');if(e.key==='Enter'&&e.target.id==='q-loc')doSearch()});
render();
</script>
</body>
</html>
